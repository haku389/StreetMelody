name: StreetMelody
options:
  bundleIdPrefix: com.streetmelody
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: "5.0.1"

targets:
  StreetMelody:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StreetMelody
        excludes:
          - "Resources/Info.plist"
          - "Resources/ServiceIcons/README.md"
    dependencies:
      - package: SpotifyiOS
        product: SpotifyiOS
    info:
      path: StreetMelody/Resources/Info.plist
      properties:
        CFBundleName: StreetMelody
        CFBundleIdentifier: com.streetmelody.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: "近くにいる人の推し曲を自動で受け取るために Bluetooth を使用します。"
        NSBluetoothPeripheralUsageDescription: "あなたの推し曲情報を近くにいる人に届けるために Bluetooth を使用します。"
        NSCameraUsageDescription: "フレンドの QR コードを読み取るためにカメラを使用します。"
        NSAppleMusicUsageDescription: "今聴いている曲を取得して共有するために、Apple Music（メディアライブラリ）の再生情報を読み取ります。"
        # Spotify App Remote が Spotify アプリの存在確認・起動を行うために必要。
        LSApplicationQueriesSchemes:
          - spotify
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # OAuth（Google/Spotify 等）のリダイレクト受け口。Supabase の Redirect URLs と一致させる。
        CFBundleURLTypes:
          - CFBundleURLName: com.streetmelody.app.oauth
            CFBundleURLSchemes:
              - com.streetmelody.app
    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.streetmelody.app
        INFOPLIST_FILE: StreetMelody/Resources/Info.plist
        DEVELOPMENT_TEAM: "FZZ6L3HF9Z"
        CODE_SIGN_STYLE: Automatic

  StreetMelodyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: StreetMelody
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.streetmelody.app.uitests

schemes:
  StreetMelody:
    build:
      targets:
        StreetMelody: all
        StreetMelodyUITests: [test]
    test:
      targets:
        - StreetMelodyUITests
